name: Carbon Black
description: 'Carbon Black is an endpoint security company, now part of Broadcom (formerly
  VMware Carbon Black), whose cloud-native platform delivers next-generation antivirus,
  endpoint detection and response (EDR), threat hunting, live query, and application
  control. The Carbon Black Cloud platform spans Endpoint Standard, Enterprise EDR,
  Audit and Remediation, and Workload/Container protection, alongside the on-premises
  Carbon Black EDR and App Control products. Its developer network at developer.carbonblack.com
  publishes REST APIs, a Python SDK, and integration guides for security operations,
  threat intelligence, and automated remediation. APIs authenticate with an API Id/Secret
  pair passed in an X-Auth-Token header against region-specific Carbon Black Cloud hostnames.'
